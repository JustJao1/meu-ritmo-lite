name: Atualizar distribuição do Meu Ritmo Lite
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código publicado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh repo clone "$GITHUB_REPOSITORY" source -- --depth=2
      - name: Conferir base e aplicar atualização
        env:
          SOURCE0: 
        working-directory: source
        run: |
          test "$(git rev-parse HEAD^)" = "c03f0c5eab57e71df87859ebbc094c1f02f8ae68"
          python3 - <<'PYCODE'
          import base64,gzip,hashlib,pathlib,os
          patch=gzip.decompress(base64.b64decode(''.join(os.environ[k] for k in sorted(os.environ) if k.startswith('SOURCE'))))
          assert hashlib.sha256(patch).hexdigest()=='8f2216f57f4f583fca4668da04cefd91ca85d525762f620e0c0dd4209a44777e'
          pathlib.Path('/tmp/migration.patch').write_bytes(patch)
          PYCODE
          git apply --index /tmp/migration.patch
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar código
        working-directory: source
        run: |
          node --test tests/*.mjs
          cd dist/releases
          sha256sum -c meu-ritmo-lite-0.1.1-dev.apk.sha256
      - name: Publicar código validado
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          git config user.name "João Victor"
          git config user.email "284127765+JustJao1@users.noreply.github.com"
          git commit -m "Distribuição independente preservando o APK"
          git push origin HEAD:main
