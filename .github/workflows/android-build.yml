name: Compilar APK Android
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app-web/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Instalar SDK Android 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validar, testar e compilar APK de testes
        working-directory: android
        run: gradle --no-daemon --stacktrace lintDebug testDebugUnitTest assembleDebug
      - name: Verificar metadados do APK
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 8
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: meu-ritmo-app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
