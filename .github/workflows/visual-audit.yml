name: Auditoria visual de temas (sem publicar)
on:
  push:
    branches: [audit/visual-themes-2026-11-13]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Iniciar site Lite local
        run: |
          python3 -m http.server 8765 --directory app-web > /tmp/lite-server.log 2>&1 &
          sleep 2
      - name: Renderizar e verificar 22 temas em desktop e celular
        run: node scripts/visual-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auditoria-visual-44-telas
          path: visual-artifacts/
          retention-days: 7
