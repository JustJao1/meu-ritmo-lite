name: Importar código e publicar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/import-source.yml']
permissions:
  contents: write
concurrency:
  group: ritmo-initial-import
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'JustJao1/meu-ritmo-lite'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Importar origem verificada e publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PYTHON'
          import os,sys,json,hashlib,urllib.request,urllib.error,zipfile,tempfile,pathlib,subprocess,shutil,stat
          repo=os.environ['GITHUB_REPOSITORY']
          assert repo == 'JustJao1/meu-ritmo-lite'
          root=pathlib.Path(tempfile.mkdtemp(prefix='ritmo-import-'))
          token=os.environ['GH_TOKEN']
          ask=root/'askpass.sh'
          ask.write_text('#!/bin/sh\ncase "$1" in *Username*) printf "%s\\n" x-access-token;; *Password*) printf "%s\\n" "$GH_TOKEN";; esac\n')
          ask.chmod(0o700)
          env=os.environ.copy();env.update(GIT_ASKPASS=str(ask),GIT_TERMINAL_PROMPT='0')
          def git(*args):
           return subprocess.check_output(['git',*args],cwd=dest,env=env,text=True).strip()
          dest=root/'repository'
          subprocess.run(['git','clone','--depth','1','https://github.com/'+repo+'.git',str(dest)],env=env,check=True)
          marker=dest/'.github/import-completed.json'
          if not marker.exists():
           allowed={'README.md','.github/workflows/import-source.yml'}
           unexpected=set(git('ls-files').splitlines())-allowed
           if unexpected:raise RuntimeError('Importação interrompida: já existem outros arquivos no repositório.')
           url='https://meu-ritmo-lite.tonedcamel16.chatgpt.site/source/meu-ritmo-lite-source.zip'
           req=urllib.request.Request(url,headers={'User-Agent':'Meu-Ritmo-source-import/1.0'})
           with urllib.request.urlopen(req,timeout=90) as r:data=r.read(10000000)
           assert hashlib.sha256(data).hexdigest()=='56149690039346ae0c0220492811983be0ff43194e670dedfdd9796bd1b6bff2','Hash da origem não confere'
           archive=root/'source.zip';archive.write_bytes(data)
           with zipfile.ZipFile(archive) as z:
            assert len(z.infolist())<1000
            for info in z.infolist():
             rel=pathlib.PurePosixPath(info.filename)
             assert not rel.is_absolute() and '..' not in rel.parts
             assert not stat.S_ISLNK(info.external_attr>>16)
             assert rel.suffix not in {'.keystore','.jks','.pem','.key','.sqlite','.db'}
             assert not (rel.name.startswith('.env') and rel.name!='.env.example')
            z.extractall(dest)
           marker.parent.mkdir(exist_ok=True)
           marker.write_text(json.dumps({'sourceSha256':'56149690039346ae0c0220492811983be0ff43194e670dedfdd9796bd1b6bff2','importedFiles':len(z.infolist()),'version':'0.1.1-dev' if repo.endswith('-lite') else 'initial'},indent=2)+'\n')
           git('config','user.name','github-actions[bot]')
           git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
           git('add','--all')
           git('commit','-m','Publica o código completo do meu-ritmo-lite')
           git('push','origin','HEAD:main')
           print('Código importado:',git('rev-parse','HEAD'))
          else:
           assert json.loads(marker.read_text())['sourceSha256']=='56149690039346ae0c0220492811983be0ff43194e670dedfdd9796bd1b6bff2'
           print('Código já importado; nenhuma alteração local sobrescrita.')

          metadata=json.loads((dest/'dist/release.json').read_text())
          apk=dest/'dist/releases/meu-ritmo-lite-0.1.1-dev.apk'
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==metadata['sha256']
          assert apk.stat().st_size==metadata['size']
          api='https://api.github.com/repos/'+repo
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'Meu-Ritmo-release'}
          def request(url,method='GET',body=None,kind='application/json'):
           h=dict(headers)
           if body is not None:h['Content-Type']=kind
           req=urllib.request.Request(url,data=body,headers=h,method=method)
           with urllib.request.urlopen(req,timeout=90) as r:return json.load(r)
          tag='v0.1.1-dev'
          try:release=request(api+'/releases/tags/'+tag)
          except urllib.error.HTTPError as e:
           if e.code!=404:raise
           notes='Meu Ritmo Lite para Android, versão experimental 0.1.1-dev.\n\nAgenda, rotina, gastos, notas, recados, lembretes e alarmes individuais do Android. Sem login, planos ou comunidade. Marca atualizada e dados no aparelho.\n\nRequer Android 8.0 ou superior. APK assinado com chave de desenvolvimento. Compilação, assinatura e testes automatizados verificados; ainda precisa de testes em aparelhos Android reais, especialmente alarmes em segundo plano e após reinício.\n\nBaixe o APK abaixo. O arquivo .sha256 permite conferir sua integridade. Não publique a chave privada de assinatura.\n'
           payload={'tag_name':tag,'target_commitish':git('rev-parse','HEAD'),'name':'Meu Ritmo Lite 0.1.1-dev · Android','body':notes,'draft':False,'prerelease':True}
           release=request(api+'/releases','POST',json.dumps(payload).encode())
          upload=release['upload_url'].split('{')[0]
          assert upload.startswith('https://uploads.github.com/repos/JustJao1/meu-ritmo-lite/')
          assets={a['name']:a for a in release.get('assets',[])}
          for f,kind in [(apk,'application/vnd.android.package-archive'),(pathlib.Path(str(apk)+'.sha256'),'text/plain')]:
           digest='sha256:'+hashlib.sha256(f.read_bytes()).hexdigest()
           if f.name in assets:
            asset=assets[f.name];assert asset['size']==f.stat().st_size
            if asset.get('digest'):assert asset['digest']==digest
           else:
            import urllib.parse
            asset=request(upload+'?name='+urllib.parse.quote(f.name),'POST',f.read_bytes(),kind)
            assert asset['size']==f.stat().st_size
            if asset.get('digest'):assert asset['digest']==digest
           print('Publicado:',asset['browser_download_url'])
          print('Release:',release['html_url'])
          PYTHON
