name: Verificar Meu Ritmo Lite
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.mjs
      - name: Conferir APK preservado
        working-directory: dist/releases
        run: sha256sum -c meu-ritmo-lite-0.1.1-dev.apk.sha256
