plugins { id 'com.android.application' }
android { namespace 'br.com.joaovictor.meuritmolite'; compileSdk 36
 defaultConfig { applicationId 'br.com.joaovictor.meuritmolite'; minSdk 26; targetSdk 36; versionCode 2; versionName '0.1.1-dev' }
 buildTypes { release { minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
