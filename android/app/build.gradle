plugins { id 'com.android.application' }
def signingStore = System.getenv('ANDROID_SIGNING_STORE')
def signingPassword = System.getenv('ANDROID_SIGNING_STORE_PASSWORD')
def signingAlias = System.getenv('ANDROID_SIGNING_KEY_ALIAS')
def signingKeyPassword = System.getenv('ANDROID_SIGNING_KEY_PASSWORD')
android {
 namespace 'br.com.joaovictor.meuritmolite'
 compileSdk 36
 defaultConfig {
  applicationId 'br.com.joaovictor.meuritmolite'
  minSdk 26
  targetSdk 36
  versionCode 2
  versionName '0.1.1-dev'
 }
 signingConfigs {
  release {
   if (signingStore && signingPassword && signingAlias && signingKeyPassword) {
    storeFile file(signingStore)
    storePassword signingPassword
    keyAlias signingAlias
    keyPassword signingKeyPassword
   }
  }
 }
 buildTypes {
  release {
   minifyEnabled false
   if (signingStore && signingPassword && signingAlias && signingKeyPassword) signingConfig signingConfigs.release
  }
 }
 compileOptions {
  sourceCompatibility JavaVersion.VERSION_1_8
  targetCompatibility JavaVersion.VERSION_1_8
 }
}
tasks.register('syncAppWeb', Copy) { from '../../app-web'; into 'src/main/assets/site' }
tasks.named('preBuild').configure { dependsOn 'syncAppWeb' }
